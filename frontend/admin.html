<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
         <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=shopping_cart,add,visibility,logout" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Admin-page</title>
</head>
<style>
    .hr{
        border: 2px solid gray;
    }
    .prod-rows {
    margin-bottom: 25px;
}


.prod-rows .col-md-3 {
    display: flex;
}

.product-card {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
    background: #f1f8fa;
}


.product-card img {
    width: 100%;          
    height: 200px;         
    object-fit: cover;    
    object-position: center; 
    border-radius: 8px;   
    display: block;       
}

    .whole-body {
    position: relative;
    min-height: 100vh;
    
}

.blur-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(5px);
    z-index: 10;
}

.popup {
    display: none;
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);

    background-color: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    
    z-index: 20;
}
.popup div{
    margin-top: 5px;
    display: flex;
    justify-content: space-between;
}

</style>
<body>
<div class="whole-body" id="whole-body">
<div class="nav-cb mt-2 mb-2 p-4 d-flex flex-row justify-content-between align-items-center flex-wrap gap-3">
    <div class="d-flex flex-row align-items-center gap-3">
        <h1 class="mb-0 nav-title">
            Admin <span class="text-primary">- View</span>
        </h1>
        <p class="mb-0 edu-font-moto text-secondary nav-tagline">
            manage your products here!
        </p>
    </div>

    <div class="d-flex flex-row gap-3 ms-3">
        <a href="#" class="text-decoration-none edu-font-moto" onclick="addprod()">
            <span class="material-symbols-outlined" style="font-size: 1.1rem; vertical-align: middle;">add</span>
            Add Products
        </a>
        <a href="#" class="text-decoration-none edu-font-moto" onclick="viewprod()">
            <span class="material-symbols-outlined" style="font-size: 1.1rem; vertical-align: middle;">visibility</span>
            View Products
        </a>
        <a href="index.html" class="text-decoration-none edu-font-moto text-danger" onclick="logout()">
            <span class="material-symbols-outlined" style="font-size: 1.1rem; vertical-align: middle;">logout</span>
            Logout
        </a>
    </div>
</div>
<hr class="hr">
<div class="blur-overlay" id="blur"></div>
<div class="container">
    <div class="row prod-rows mt-5" id="container">

   
    <div class="col-md-3">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853" alt="Laptop">
            <h5>HP Laptop</h5>
            <p>15.6-inch Full HD Laptop</p>
            <h6>₹45,999</h6>
            <p>⭐ 4.5</p>
            <button class="btn btn-primary" onclick="edit(this)">Edit</button>
        </div>
    </div> 
</div>


<div class="popup" id="popup">
    <h4 class="text-secondary text-center">Edit Your Changes</h4>
    <div class="proname container">
        <label for="" class="form-label">Product :</label>
        <input type="text" id="editProductName">
    </div>
    <div class="price container">
        <label for="" class="form-label">Price : </label>
        <input type="text" name="" id="editPrice">
    </div>
    <div class="container">
        <label for="" class="form-label">Description : </label>
        <input type="text" id="editDescription">
    </div>
    <div class="text-center">
    <button class="btn btn-primary" onclick="back()">Back</button>
    <button  class="btn btn-primary ms-2" onclick="change()">Change</button>
    </div>
</div>
</div>
    <script>
        
    </script>
    <script src="admin.js"></script>
</body>
</html>
