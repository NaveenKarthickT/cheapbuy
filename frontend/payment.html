<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .payment-box {
      border: 1px solid #daecf0;
      border-radius: 10px;
      min-height: 80px;
      transition: min-height 0.2s;
      padding: 1rem;
    }

    .pro-details {
      border: 2px solid gray;
      border-radius: 15px;
      width: 100%;
      padding: 15px;
      gap: 12px;
      background: #f1f8fa;
      border: 1px solid #daecf0;
    }

   

   
    .order-summary-box {
      background: #f1f8fa;
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #daecf0;
      margin-top: 16px;
    }

    .order-summary-box .item-label {
      font-size: 15px;
      color: #6b7f8c;
      font-weight: 400;
    }

    .order-summary-box .item-total {
      font-size: 20px;
      font-weight: 700;
      color: #1a2b3c;
      letter-spacing: -0.3px;
    }
    .addressfield textarea{
        width: 100%;
        border:1px solid #daecf0;
        border-radius: 10px;
        outline: #daecf0 ;
    }
    .addressfield{
       padding: 2px;
    }
    .total-amount , .discount , .final-amount{
              background: #f1f8fa;
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #daecf0;
      margin-top: 16px;
    }
    .pay-btn{
        background-color:#13abd5 ;
        color: #1a2b3c;
        
    }
    .pay-btn:hover{
        background-color: #1a2b3c;
        color: #13abd5;
    }

  </style>
</head>
<body>
  <div class="container text-center mt-2">
    <h1 class="text-secondary">
      Pay For Your - <span class="text-primary">Item</span>
    </h1>
  </div>
  <hr class="hr">

  <div class="container payment-box">
    <h1 class="text-secondary text-center">Payment</h1>

    <div class="d-flex justify-content-center mt-3">
      <div class="pro-details d-flex justify-content-between align-items-center">
        <span id="product" class="text-secondary"></span>
        <span id="quantity">
            <span class="text-secondary">Quantity :</span>
          <input type="number" value="1" min="1" id="input">
        </span>
      </div>
    </div>

    
    <div class="order-summary-box mt-3">
      <span class="item-label" id="product1"></span>
      <span class="text-secondary">:</span>
      <span class="item-total" id="price"></span>
    </div>
<div class="addressfield mt-2">
    <textarea placeholder="Enter your address" class="p-2"></textarea>
</div>

<div class="total-amount">
    <span class="text-secondary">Total-Amount  </span>
    <span class="text-secondary">:</span>
    <span id="total-amount"></span>
</div>

<div class="discount">
  <span class="text-secondary">Discount</span>
  <span>:</span>
  <span id="discount"></span>
</div>
<div class="final-amount">
  <span class="text-secondary">Final-Amount</span>
  <span>:</span>
  <span id="final-amount"></span>
</div>

<div class="text-center">
    <button class="btn pay-btn ps-5 pe-5 mt-3 ">Pay
        <span id="paying-amount"></span>
    </button>
</div>
  </div>

  <script src="payment.js"></script>
</body>
</html>
