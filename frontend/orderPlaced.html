<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Tracking</title>
    <link rel="stylesheet" href="orderPlaced.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

    <style>
        body {
            background-color: #f5f5f5;
        }

        .tracking {
            display: none;
            background: white;
            border-radius: 12px;
            max-width: 950px;
            margin-top: 60px;
            padding: 25px;

            z-index: 20;
            position: fixed;
    top: 50px;
    left: 160px;
            
        }

        .tracking .card {
            border-radius: 10px;
            padding: 20px;
        }

        .order-flow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .step {
            text-align: center;
            font-weight: 500;
        }

        @media(max-width: 600px) {
            .order-flow {
                flex-direction: column;
            }
        }
        .status span{
            display: none;
        }
        .step {
    color: gray;
    opacity: 0.5;
}

.step.active {
    color: green;
    font-weight: bold;
    opacity: 1;
}
    </style>

<body class="bg-light">

    <!-- Navbar -->
    <div class="nav container d-flex justify-content-between align-items-center py-3">

        <div>
            <h1>
                Cheap -
                <span class="text-primary">Buy</span>
            </h1>
        </div>

        <div>
            <h5 id="name" onclick="window.location.href='login.html'">Home</h5>
        </div>

    </div>
    <hr class="container">
    <div class="container mt-4">
        <h2 class="mb-4">My Orders</h2>
    </div>

    <div class="blur" id="blur"></div>



    <div class="tracking container" id="tracking">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3 class="text-secondary mb-0">
                <strong>Tracking :</strong>
            </h3>

            <button class="btn-close" onclick="closeTracking()"></button>

        </div>

        <!-- Order Flow -->
        <div class="card mb-4">

            <h5 class="mb-4">Order Flow :</h5>

            <div class="order-flow">

                <span class="step text-success" id="placed">🟢 Order Placed</span>
                
                →
                <span class="step" id="shipped">🚚 Shipped</span>
                →
                <span class="step" id="out">🚚 Out for Delivery</span>
                →
                <span class="step" id="delivered">📦 Delivered</span>

            </div>

        </div>

        
      <h5 class="text-secondary">Status : 
        <span id="status" class="text-success"></span>
      </h5>

    </div>

    <script>
       
    </script>


<script src="orderPlaced.js"></script>
</body>
</html>
