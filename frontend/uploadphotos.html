<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <title>Add Product</title>
</head>
<style>
    .hr{
        border: 2px solid gray;
    }
    .error-msg{
        display: none;
    }
    .form-label{
        color: gray;
    }
    .whole-input{
        border: 2px solid #f1f8fa;
        padding: 10px;
    }
    .form-control{
        background-color: #f1f8fa;
    }
   h1>span{
    background-color: #f1f8fa;
    border: 5px solid #f1f8fa;
    border-radius: 20px;
    padding: 3px;
   }
</style>

<body>
    <h1 class="text-center mt-3 text-secondary">Add - 
        <span class="text-primary" >Products</span>
    </h1>
    <hr class="hr">
    <div class="mb-5"></div>
    
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4">
<form id="productForm" >

    <div class="mb-3 whole-input">
        <label for=""  class="form-label">Product Name
            <span class="text-danger">*</span>:
        </label>
        <div class="d-flex justify-content-between">
        <input type="text" id="name" placeholder=" Enter The Product Name" class="input form-control">
        <p class="text-danger text-center error-msg text-start" id="prod-errmsg"></p>
        </div>
    </div>

    <div class="mb-3 whole-input" >
        <label for=""  class="form-label">Price
            <span class="text-danger">*</span>:
        </label>
        <div class="d-flex justify-content-between">
        <input type="number" id="price" placeholder=" Enter The Price" class="form-control">
         <p class="text-danger text-center error-msg" id="price-errmsg"></p>
        </div>
    </div>

    <div class="mb-3 whole-input">
          <label for=""  class="form-label">Description
            <span class="text-danger">*</span>:
        </label>
        <div class="d-flex justify-content-between">
        <input type="text" id="description" placeholder="Enter The Description" class="form-control">
         <p class="text-danger text-center error-msg" id="des-errmsg"></p>
        </div>
    </div>

    <div class="mb-3 whole-input">
        <label for=""  class="form-label">Upload Image 
            <span class="text-danger">*</span>
            :</label>
            <div class="d-flex justify-content-between">
        <input type="file" id="image" class="form-control">
         <p class="text-danger text-center error-msg" id="img-errmsg"></p>
            </div>
    </div>

    <div>
        <button type="button" class="btn btn-primary" onclick="addproducts()">
            Add Product
        </button>
    </div>

</form>
</div>
<div class="col-md-4"></div>
</div>
    <script src="uploadphotos.js"></script>

</body>
</html>
