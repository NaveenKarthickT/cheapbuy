<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close" />
    <link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close,dark_mode,light_mode" />
    <link rel="stylesheet" href="sellerDashBoard.css">
    <title>Seller-Dashboard</title>
</head>
<body>
    <div class="container nav">
        
        <div class="logo">
          
            <h2 class="Buisness-Name text-primary" id="Buisness-Name"></h2>
            <button class="notification" id="notification"></button>
        </div>
        
        <div class="nav-right">

            <strong>
    <span
        class="text-secondary material-symbols-outlined"
        id="darkModeBtn"
        onclick="toggleDarkMode()">

        dark_mode

    </span>
</strong>
                        <strong><span class="text-secondary ms-3" onclick="window.location.href='DashBoard.html'">DashBoard</span></strong>

            <strong><span class="text-secondary ms-3" id="addprod" onclick="addprod()">Add Products</span></strong>
            <strong><span class="text-secondary ms-3 " onclick="viewproduct()">View Products</span></strong>
            <strong><span class="text-secondary ms-3" onclick="viewprod()">Order Details</span></strong>
            <strong><span class="text-secondary ms-3" onclick="viewreport()">Report</span></strong>
        </div>
    </div>
 <div class="container">
        <hr class="hr">
    </div>

    <div class="container">
        <div>
            <h1 class="welcome-message">Welcome Back 
                <span class="name" id="name"></span>
                !!! :
            </h1>
        </div>
    </div>
  
    <div class=" recent-order row prod-rows mt-5 ms-5" id="container">
        <span id="err-msg" class="text-center text-danger">No Recent Orders</span>
          <span class="welcome-message mb-5" id="rec-order">Recent Order:</span>  
    </div>
    
    <div class="report container text-center" id="report">
        <span class="welcome-message" id="rec-order">Filter:</span>  
        <div class="filter mt-3">
        <label for="">Start-Date : </label>
        <input type="date"  id="Start-Date">
        <label for="" id="ed">End-Date : </label>
        <input type="date" id="End-Date">    
        <button class="btn btn-success" onclick="search()" id="btn">Search</button>
        </div>
        <hr class="hr">
        <div class="report-content" id="report-content">
            <table class="table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="filter-result">

                </tbody>
            </table>
           
        </div>
         <span id="filter-err">No Matched Result !!</span>
    </div>

    <div class="row prod-rows mt-5 container ms-5" id="containerr">
        <table class="table table-bordered ">
    <thead>
        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Availability</th>
            <th>Edit</th>
        </tr>
    </thead>

    <tbody id="product-table">
    </tbody>
</table>
    </div>
    <div class="blur-overlay" id="blur"></div>

    <div class="popup" id="popup">
    <h4 class="text-secondary text-center">Edit Your Changes</h4>
    <div class="proname container">
        <label for="" class="form-label">Product :</label>
        <input type="text" id="editProductName">
    </div>
    <div class="price container">
        <label for="" class="form-label">Price : </label>
        <input type="text" name="" id="editPrice">
    </div>
    <div class="container">
        <label for="" class="form-label">Description : </label>
        <input type="text" id="editDescription">
    </div>
    <div class="container">
        <label for="editQuantity"> Quantity :</label>
        <input type="number" id="editQuantity" min="0" required>
    </div>
    <div class="text-center">
    <button class="btn btn-primary" onclick="back()">Back</button>
    <button  class="btn btn-primary ms-2" onclick="change()">Change</button>
    </div>
</div>
    

<div class="low-stock-products container">
    <div>
        <button class="btn btn-danger">Close</button>
    </div>

</div>

<div id="chooseAgent">
    <div class="content">
        <strong class="text-secondary">Agent List</strong>
        <strong><span class="material-symbols-outlined close" onclick="closeAgentList()">
                close
            </span>
        </strong>
    </div>
    <label for="category">Select Agent:</label>
    <select name="Agents" id="agent_names">

    </select>
    <button onclick="assign()" class="btn btn-primary">Assign</button>
</div>
 
   

<script src="sellerDashBoard.js"></script>
</body>
</html>
