<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back">

    <title>Add Product</title>

</head>


<style>

    .hr {
        border: 2px solid gray;
    }

    .error-msg {
        display: none;
        font-size: 13px;
        margin-top: 5px;
        margin-bottom: 0;
    }

    .form-label {
        color: #555;
        font-weight: 600;
    }

    .form-control {
        background-color: #f8fafc;
        border: 1px solid #dee2e6;
        min-height: 45px;
    }

    .form-control:focus {
        background-color: white;
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.1);
    }

    textarea.form-control {
        min-height: 110px;
        resize: vertical;
    }

    h1 > span {
        background-color: #f1f8fa;
        border: 5px solid #f1f8fa;
        border-radius: 20px;
        padding: 3px;
    }

    #back {
        cursor: pointer;
    }




    .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
    }

    .nav-right {
        padding-left: 2px;
        padding-right: 2px;
        width: max-content;
        align-items: center;
    }

    .nav-right strong span {
        cursor: pointer;
    }

    .Buisness-Name {
        color: #1a3b5d;
        font-weight: 800;
        letter-spacing: -0.3px;
    }

    .Buisness-Name {
        background: linear-gradient(135deg, #1a3b5d, #2f6f9f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: 800;
    }


    .product-card {

        background-color: white;

        padding: 30px;

        border-radius: 15px;

        border: 1px solid #e9ecef;

       
    }


    .form-header {

        margin-bottom: 25px;

    }


    .form-header h3 {

        color: #1a3b5d;

        font-weight: 700;

        margin-bottom: 5px;

    }


    .form-header p {

        color: gray;

        margin-bottom: 0;

    }

</style>


<body>


  

    <div class="container nav">

        <div class="logo">

            <h2
                class="Buisness-Name text-primary"
                id="Buisness-Name">
            </h2>

        </div>

        <div class="nav-right">

            <strong>
                <span
                    class="text-secondary ms-3"
                    onclick="window.location.href='DashBoard.html'">
                    DashBoard
                </span>
            </strong>

            <strong>
                <span
                    class="text-secondary ms-3"
                    id="addprod"
                    onclick="addprod()">
                    Add Products
                </span>
            </strong>

            <strong>
                <span
                    class="text-secondary ms-3"
                    onclick="viewproduct()">
                    View Products
                </span>
            </strong>

            <strong>
                <span
                    class="text-secondary ms-3"
                    onclick="viewprod()">
                    Order Details
                </span>
            </strong>

            <strong>
                <span
                    class="text-secondary ms-3"
                    onclick="viewreport()">
                    Report
                </span>
            </strong>

        </div>

    </div>


    <div class="container">

        <hr class="hr">

    </div>



    <div class="container mt-5 mb-5">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="product-card">


                    <div class="form-header">

                        <h3>Add New Product</h3>

                        <!-- <p>
                            Enter your product details below
                        </p> -->

                    </div>


                    <form id="productForm">


                     

                        <div class="mb-3">

                            <label
                                for="name"
                                class="form-label">

                                Product Name
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter the product name"
                                class="form-control">

                            <p
                                class="text-danger error-msg"
                                id="prod-errmsg">
                            </p>

                        </div>


                      
                        <div class="mb-3">

                            <label
                                for="price"
                                class="form-label">

                                Price
                                <span class="text-danger">*</span>

                            </label>


                            <div class="input-group">

                                <!-- <span class="input-group-text">
                                    ₹
                                </span> -->

                                <input
                                    type="number"
                                    id="price"
                                    placeholder="Enter the price"
                                    class="form-control"
                                    min="1">

                            </div>


                            <p
                                class="text-danger error-msg"
                                id="price-errmsg">
                            </p>

                        </div>


                        <div class="mb-3">

                            <label
                                for="description"
                                class="form-label">

                                Description
                                <span class="text-danger">*</span>

                            </label>


                            <textarea
                                id="description"
                                placeholder="Enter the product description"
                                class="form-control"
                                rows="4"></textarea>


                            <p
                                class="text-danger error-msg"
                                id="des-errmsg">
                            </p>

                        </div>


                        <div class="mb-3">


                           
                                <label
                                    for="discount"
                                    class="form-label">

                                    Discount (%)

                                </label>


                                <input
                                    type="number"
                                    id="discount"
                                    placeholder="Enter discount"
                                    class="form-control"
                                    min="0"
                                    max="100">


                                <p
                                    class="text-danger error-msg"
                                    id="discount-err">
                                </p>

                        </div>


                            <div class="mb-3">

                                <label
                                    for="availQuan"
                                    class="form-label">

                                    Available Quantity
                                    <span class="text-danger">*</span>

                                </label>


                                <input
                                    type="number"
                                    id="availQuan"
                                    placeholder="Enter quantity"
                                    class="form-control"
                                    min="1">


                                <p
                                    class="text-danger error-msg"
                                    id="availQuantity-err">
                                </p>

                            </div>




                        

                        <div class="mb-4">

                            <label
                                for="image"
                                class="form-label">

                                Product Image
                                <span class="text-danger">*</span>

                            </label>


                            <input
                                type="file"
                                id="image"
                                class="form-control"
                                accept="image/*">


                            <p
                                class="text-danger error-msg"
                                id="img-errmsg">
                            </p>

                        </div>



                        <div class="d-flex gap-3">


                            <button
                                type="button"
                                class="btn btn-primary flex-grow-1"
                                onclick="addproducts()">

                                Add Product

                            </button>


                            <!-- <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="backk()">

                                Cancel

                            </button> -->


                        </div>


                    </form>


                </div>

            </div>

        </div>

    </div>


    <script src="addprod.js"></script>

</body>

</html>
